<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <title>ระบบลงเวลาพนักงาน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- App Shell -->
  <div id="app" class="app">

    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="app-logo">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
            <rect width="30" height="30" rx="8" fill="url(#hgrad)"/>
            <defs><linearGradient id="hgrad" x1="0" y1="0" x2="30" y2="30">
              <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient></defs>
            <circle cx="15" cy="11" r="4" fill="white" opacity="0.9"/>
            <path d="M7 23c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
          </svg>
        </div>
        <div class="header-title">
          <h1>ระบบลงเวลาพนักงาน</h1>
          <span id="header-clock" class="header-clock">00:00</span>
        </div>
      </div>
      <div class="header-right">
        <div id="header-date" class="header-date"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="main-content">

      <!-- ========== PAGE: SCAN ========== -->
      <section class="page active" id="page-scan">
        <div class="clock-block">
          <div id="clock-time" class="clock-time">00:00:00</div>
          <div id="clock-date" class="clock-date"></div>
        </div>

        <!-- Employee Selector -->
        <div class="card select-card">
          <label class="field-label">เลือกพนักงาน</label>
          <div class="select-wrapper">
            <select id="scan-emp-select" class="styled-select">
              <option value="">— เลือกพนักงาน —</option>
            </select>
            <svg class="select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <!-- Camera + Stamp Preview -->
        <div class="card camera-card">
          <div class="camera-wrap" id="camera-wrap">
            <video id="camera-video" autoplay playsinline muted></video>
            <canvas id="stamp-canvas" class="stamp-canvas"></canvas>
            <!-- Stamp overlay shown on canvas -->
            <div class="cam-corners">
              <span class="corner tl"></span><span class="corner tr"></span>
              <span class="corner bl"></span><span class="corner br"></span>
            </div>
          </div>
          <div class="cam-status" id="cam-status">
            <span class="cam-status-dot"></span>
            <span id="cam-status-text">กำลังเปิดกล้อง...</span>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-row">
          <button class="btn btn-checkin" id="btn-checkin" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            ถ่ายรูป <strong>เข้างาน</strong>
          </button>
          <button class="btn btn-checkout" id="btn-checkout" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            ถ่ายรูป <strong>ออกงาน</strong>
          </button>
        </div>

        <!-- Result flash -->
        <div id="scan-result" class="scan-result hidden"></div>

        <!-- Today's log -->
        <div class="card today-log-card">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            บันทึกวันนี้
          </div>
          <div id="today-log" class="today-log">
            <div class="empty-state">ยังไม่มีการลงเวลาวันนี้</div>
          </div>
        </div>
      </section>

      <!-- ========== PAGE: EMPLOYEES ========== -->
      <section class="page" id="page-employees">
        <div class="page-toolbar">
          <input type="text" id="emp-search" class="search-input" placeholder="🔍 ค้นหาพนักงาน..." />
          <button class="btn btn-add" id="btn-add-emp">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            เพิ่มพนักงาน
          </button>
        </div>
        <div id="emp-list" class="emp-list"></div>
      </section>

      <!-- ========== PAGE: HISTORY ========== -->
      <section class="page" id="page-history">
        <div class="card filter-card">
          <div class="filter-label">ช่วงเวลา</div>
          <div class="filter-chips">
            <button class="chip active" data-days="7">7 วัน</button>
            <button class="chip" data-days="14">14 วัน</button>
            <button class="chip" data-days="30">30 วัน</button>
            <button class="chip" data-days="0">กำหนดเอง</button>
          </div>
          <div class="date-range-wrap hidden" id="date-range-wrap">
            <input type="date" id="range-from" class="date-input" />
            <span>ถึง</span>
            <input type="date" id="range-to" class="date-input" />
            <button class="btn btn-sm" id="btn-apply-range">ดู</button>
          </div>
        </div>

        <div class="stats-row" id="stats-row"></div>

        <div class="card">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            รายงานการลงเวลา
            <button class="btn btn-sm btn-export" id="btn-export-csv" style="margin-left:auto">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Export CSV
            </button>
          </div>
          <div id="history-table-wrap" class="table-scroll"></div>
        </div>
      </section>

    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-page="scan">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>ลงเวลา</span>
      </button>
      <button class="nav-btn" data-page="employees">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>พนักงาน</span>
      </button>
      <button class="nav-btn" data-page="history">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>สรุป</span>
      </button>
    </nav>

  </div><!-- /app -->

  <!-- ========== MODAL: ADD / EDIT EMPLOYEE ========== -->
  <div class="modal-backdrop hidden" id="modal-emp">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-emp-title">เพิ่มพนักงาน</h3>
        <button class="modal-close" id="modal-emp-close">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="emp-id" />
        <div class="form-group">
          <label class="field-label">ชื่อ-นามสกุล <span class="required">*</span></label>
          <input type="text" id="emp-name" class="form-input" placeholder="เช่น สมชาย ใจดี" />
        </div>
        <div class="form-group">
          <label class="field-label">ตำแหน่ง</label>
          <input type="text" id="emp-position" class="form-input" placeholder="เช่น พนักงานขาย" />
        </div>
        <div class="form-group">
          <label class="field-label">รหัสพนักงาน</label>
          <input type="text" id="emp-code" class="form-input" placeholder="เช่น EMP001" />
        </div>
        <div class="form-group">
          <label class="field-label">แผนก</label>
          <input type="text" id="emp-dept" class="form-input" placeholder="เช่น ฝ่ายขาย" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="modal-emp-cancel">ยกเลิก</button>
        <button class="btn btn-primary" id="modal-emp-save">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- ========== MODAL: PHOTO PREVIEW (before save) ========== -->
  <div class="modal-backdrop hidden" id="modal-preview">
    <div class="modal modal-photo">
      <div class="modal-header">
        <h3 id="preview-title">ยืนยันการลงเวลา</h3>
        <button class="modal-close" id="modal-preview-close">&times;</button>
      </div>
      <div class="modal-body preview-body">
        <div class="preview-emp-info" id="preview-emp-info"></div>
        <div class="preview-img-wrap">
          <img id="preview-img" src="" alt="รูปถ่าย" class="preview-img" />
        </div>
        <div class="preview-timestamp" id="preview-timestamp"></div>
        <p class="preview-hint">ตรวจสอบรูปและข้อมูลก่อนยืนยัน</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="btn-retake">ถ่ายใหม่</button>
        <button class="btn btn-primary" id="btn-confirm-save">✓ ยืนยันบันทึก</button>
      </div>
    </div>
  </div>

  <!-- ========== MODAL: VIEW PHOTO ========== -->
  <div class="modal-backdrop hidden" id="modal-view-photo">
    <div class="modal modal-photo">
      <div class="modal-header">
        <h3 id="view-photo-title">รูปถ่ายลงเวลา</h3>
        <button class="modal-close" id="modal-view-photo-close">&times;</button>
      </div>
      <div class="modal-body preview-body">
        <img id="view-photo-img" src="" alt="รูปถ่าย" class="preview-img" />
        <div class="preview-timestamp" id="view-photo-info"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
